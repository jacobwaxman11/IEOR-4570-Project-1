<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Chatbot Agent</title>
    <style>
         :root {
            --bg: #000;
            --surface: #121212;
            --surface-2: #1c1c1e;
            --border: #2c2c2e;
            --text: #f2f2f7;
            --muted: #8e8e93;
            --user-bubble: #0a84ff;
            --bot-bubble: #2c2c2e;
            --accent: #f7931a;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #container {
            width: 100%;
            max-width: 430px;
            height: min(100dvh, 860px);
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            overflow: hidden;
        }
        
        @media (max-width: 480px) {
            #container {
                height: 100dvh;
                border: none;
                border-radius: 0;
            }
        }
        
        header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #627eea);
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        
        header h1 {
            font-size: 1rem;
            font-weight: 600;
        }
        
        header p {
            font-size: 0.75rem;
            color: var(--muted);
        }
        
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .msg {
            max-width: 80%;
            padding: 0.6rem 0.9rem;
            border-radius: 18px;
            line-height: 1.4;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .msg.user {
            align-self: flex-end;
            background: var(--user-bubble);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        
        .msg.assistant {
            align-self: flex-start;
            background: var(--bot-bubble);
            border-bottom-left-radius: 4px;
        }
        
        .msg.loading {
            display: flex;
            gap: 4px;
            padding: 0.8rem 1rem;
        }
        
        .msg.loading span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            animation: blink 1.2s infinite;
        }
        
        .msg.loading span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .msg.loading span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes blink {
            0%,
            80%,
            100% {
                opacity: 0.3;
            }
            40% {
                opacity: 1;
            }
        }
        
        .tool {
            align-self: flex-start;
            max-width: 80%;
            font-family: ui-monospace, monospace;
            font-size: 0.7rem;
            color: var(--muted);
            background: transparent;
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 10px;
            padding: 0.4rem 0.6rem;
        }
        
        .tool summary {
            cursor: pointer;
            color: var(--accent);
            list-style: none;
        }
        
        .tool pre {
            margin-top: 0.4rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 200px;
            overflow-y: auto;
        }
        
        #input-area {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem;
            background: var(--surface-2);
            border-top: 1px solid var(--border);
        }
        
        #user-input {
            flex: 1;
            padding: 0.65rem 1rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }
        
        #user-input:focus {
            border-color: var(--user-bubble);
        }
        
        button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--user-bubble);
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
        }
        
        button:disabled {
            opacity: 0.35;
            cursor: default;
        }
    </style>
</head>

<body>
    <div id="container">
        <header>
            <div class="avatar">₿</div>
            <div>
                <h1>Crypto Chatbot Agent</h1>
                <p>Live prices, latest headlines, and Ethereum transaction lookups</p>
            </div>
        </header>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Ask about BTC, news, or a tx hash..." autocomplete="off" />
            <button id="send-btn" aria-label="Send">↑</button>
        </div>
    </div>
    <script>
        const messages = document.getElementById("messages");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        let sessionId = null;

        function addMessage(role, text) {
            const div = document.createElement("div");
            div.className = "msg " + role;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function addLoading() {
            const div = document.createElement("div");
            div.className = "msg assistant loading";
            div.innerHTML = "<span></span><span></span><span></span>";
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function addToolCall(call, before) {
            const details = document.createElement("details");
            details.className = "tool";
            const summary = document.createElement("summary");
            summary.textContent = "⚙ " + call.name + "(" + JSON.stringify(call.args) + ")";
            const pre = document.createElement("pre");
            pre.textContent = call.result;
            details.append(summary, pre);
            messages.insertBefore(details, before);
        }

        function finish(loading, text) {
            loading.className = "msg assistant";
            loading.textContent = text;
            messages.scrollTop = messages.scrollHeight;
        }

        async function send() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = "";
            sendBtn.disabled = true;
            addMessage("user", text);
            const loading = addLoading();

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: text,
                        session_id: sessionId
                    }),
                });
                const data = await res.json();
                sessionId = data.session_id;

                for (const call of data.tool_calls || []) addToolCall(call, loading);
                finish(loading, data.response);
            } catch (e) {
                finish(loading, "Error: " + e.message);
            }
            sendBtn.disabled = false;
            userInput.focus();
        }

        sendBtn.addEventListener("click", send);
        userInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") send();
        });
        userInput.focus();
    </script>
</body>

</html>
