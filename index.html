<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Chatbot Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <style>
        :root {
            --bg: #0b0b0d;
            --surface: #121214;
            --surface-2: #1c1c1e;
            --border: #2c2c2e;
            --text: #f2f2f7;
            --muted: #8e8e93;
            --user-bubble: #0a84ff;
            --bot-bubble: #1c1c1e;
            --accent: #f7931a;
            --column: 860px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.9rem 1.5rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #627eea);
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.05rem;
            font-weight: 600;
        }

        header p {
            font-size: 0.8rem;
            color: var(--muted);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 1.5rem;
        }

        #thread {
            max-width: var(--column);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .msg {
            padding: 0.75rem 1rem;
            border-radius: 16px;
            line-height: 1.55;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .msg.user {
            align-self: flex-end;
            max-width: 70%;
            background: var(--user-bubble);
            color: #fff;
            border-bottom-right-radius: 4px;
            white-space: pre-wrap;
        }

        .msg.assistant {
            align-self: flex-start;
            max-width: 100%;
            background: var(--bot-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        /* Markdown inside assistant replies */
        .msg.assistant> :first-child { margin-top: 0; }
        .msg.assistant> :last-child { margin-bottom: 0; }
        .msg.assistant p,
        .msg.assistant ul,
        .msg.assistant ol,
        .msg.assistant table,
        .msg.assistant pre { margin: 0.6rem 0; }
        .msg.assistant h1,
        .msg.assistant h2,
        .msg.assistant h3,
        .msg.assistant h4 { margin: 1rem 0 0.4rem; line-height: 1.3; }
        .msg.assistant h1 { font-size: 1.3rem; }
        .msg.assistant h2 { font-size: 1.15rem; }
        .msg.assistant h3 { font-size: 1.05rem; }
        .msg.assistant h4 { font-size: 0.95rem; }
        .msg.assistant ul,
        .msg.assistant ol { padding-left: 1.4rem; }
        .msg.assistant li { margin: 0.25rem 0; }
        .msg.assistant strong { color: #fff; }
        .msg.assistant a { color: var(--user-bubble); }
        .msg.assistant em { color: #c7c7cc; }
        .msg.assistant hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }
        .msg.assistant code {
            font-family: ui-monospace, monospace;
            font-size: 0.85em;
            background: var(--surface);
            padding: 0.1rem 0.35rem;
            border-radius: 5px;
        }
        .msg.assistant pre {
            background: var(--surface);
            padding: 0.75rem;
            border-radius: 8px;
            overflow-x: auto;
        }
        .msg.assistant pre code { padding: 0; background: none; }
        .msg.assistant table { border-collapse: collapse; font-size: 0.88rem; display: block; overflow-x: auto; }
        .msg.assistant th,
        .msg.assistant td { border: 1px solid var(--border); padding: 0.4rem 0.65rem; text-align: left; }
        .msg.assistant th { background: var(--surface); }

        .msg.loading {
            display: flex;
            gap: 4px;
            padding: 0.9rem 1rem;
        }

        .msg.loading span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            animation: blink 1.2s infinite;
        }

        .msg.loading span:nth-child(2) { animation-delay: 0.2s; }
        .msg.loading span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        /* Tool activity for one turn */
        .tools {
            align-self: flex-start;
            width: 100%;
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 10px;
            background: var(--surface);
            font-size: 0.8rem;
        }

        .tools > summary {
            cursor: pointer;
            padding: 0.55rem 0.8rem;
            color: var(--accent);
            font-weight: 600;
        }

        .tool-list {
            list-style: none;
            padding: 0 0.8rem 0.6rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .tool-list .tool-list {
            padding: 0.3rem 0 0 1.1rem;
            border-left: 1px dashed var(--border);
            margin-left: 0.4rem;
        }

        .tool summary {
            cursor: pointer;
            font-family: ui-monospace, monospace;
            color: var(--muted);
            list-style: none;
        }

        .tool summary::before {
            content: "▸ ";
            color: var(--accent);
        }

        .tool[open] > summary::before {
            content: "▾ ";
        }

        .tool .name {
            color: var(--text);
        }

        .tool .badge {
            margin-left: 0.4rem;
            font-size: 0.7rem;
            color: var(--accent);
        }

        .tool .error {
            margin-left: 0.4rem;
            color: #ff6961;
        }

        .tool pre {
            margin: 0.35rem 0 0.2rem;
            padding: 0.5rem 0.6rem;
            background: var(--bg);
            border-radius: 6px;
            font-family: ui-monospace, monospace;
            font-size: 0.72rem;
            color: var(--muted);
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 260px;
            overflow-y: auto;
        }

        #input-area {
            padding: 1rem 1.5rem 1.25rem;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }

        #input-row {
            max-width: var(--column);
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 0.6rem;
        }

        #user-input {
            flex: 1;
            resize: none;
            min-height: 46px;
            max-height: 220px;
            padding: 0.7rem 1rem;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface-2);
            color: var(--text);
            font: inherit;
            font-size: 0.95rem;
            line-height: 1.45;
            outline: none;
            overflow-y: auto;
        }

        #user-input:focus {
            border-color: var(--user-bubble);
        }

        #send-btn {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            border-radius: 12px;
            border: none;
            background: var(--user-bubble);
            color: #fff;
            font-size: 1.15rem;
            cursor: pointer;
        }

        #send-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .hint {
            max-width: var(--column);
            margin: 0.45rem auto 0;
            font-size: 0.72rem;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <header>
        <div class="avatar">₿</div>
        <div>
            <h1>Crypto Chatbot Agent</h1>
            <p>Live prices, price history, market sentiment, news, and multi-source research across top crypto assets</p>
        </div>
    </header>
    <div id="messages">
        <div id="thread"></div>
    </div>
    <div id="input-area">
        <div id="input-row">
            <textarea id="user-input" rows="1" placeholder="Ask about prices, sentiment, news, or which coin to hold..." autocomplete="off"></textarea>
            <button id="send-btn" aria-label="Send">↑</button>
        </div>
        <p class="hint">Enter to send, Shift + Enter for a new line</p>
    </div>
    <script>
        const scroller = document.getElementById("messages");
        const thread = document.getElementById("thread");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        let sessionId = null;

        function scrollToBottom() {
            scroller.scrollTop = scroller.scrollHeight;
        }

        function renderMarkdown(text) {
            if (window.marked && window.DOMPurify) {
                return DOMPurify.sanitize(marked.parse(text || ""));
            }
            const div = document.createElement("div");
            div.textContent = text || "";
            return div.innerHTML.replace(/\n/g, "<br>");
        }

        function addMessage(role, text) {
            const div = document.createElement("div");
            div.className = "msg " + role;
            if (role === "assistant") div.innerHTML = renderMarkdown(text);
            else div.textContent = text;
            thread.appendChild(div);
            scrollToBottom();
            return div;
        }

        function addLoading() {
            const div = document.createElement("div");
            div.className = "msg assistant loading";
            div.innerHTML = "<span></span><span></span><span></span>";
            thread.appendChild(div);
            scrollToBottom();
            return div;
        }

        function countCalls(calls) {
            return calls.reduce((n, c) => n + 1 + countCalls(c.sub_calls || []), 0);
        }

        function toolItem(call) {
            const li = document.createElement("li");
            const details = document.createElement("details");
            details.className = "tool";

            const summary = document.createElement("summary");
            const name = document.createElement("span");
            name.className = "name";
            name.textContent = call.name;
            summary.append(name, document.createTextNode("(" + JSON.stringify(call.args || {}) + ")"));

            const subs = call.sub_calls || [];
            if (subs.length) {
                const badge = document.createElement("span");
                badge.className = "badge";
                badge.textContent = "ran " + subs.length + " tools";
                summary.appendChild(badge);
            }
            try {
                const parsed = JSON.parse(call.result);
                if (parsed && parsed.error) {
                    const err = document.createElement("span");
                    err.className = "error";
                    err.textContent = "error";
                    summary.appendChild(err);
                }
            } catch (_) {}

            const pre = document.createElement("pre");
            try {
                pre.textContent = JSON.stringify(JSON.parse(call.result), null, 2);
            } catch (_) {
                pre.textContent = call.result;
            }
            details.append(summary, pre);
            li.appendChild(details);

            if (subs.length) li.appendChild(toolList(subs));
            return li;
        }

        function toolList(calls) {
            const ul = document.createElement("ul");
            ul.className = "tool-list";
            for (const call of calls) ul.appendChild(toolItem(call));
            return ul;
        }

        function addToolActivity(calls, before) {
            if (!calls.length) return;
            const total = countCalls(calls);
            const group = document.createElement("details");
            group.className = "tools";
            group.open = true;
            const summary = document.createElement("summary");
            summary.textContent = "⚙ Used " + total + " tool" + (total === 1 ? "" : "s");
            group.append(summary, toolList(calls));
            thread.insertBefore(group, before);
        }

        function finish(loading, text) {
            loading.className = "msg assistant";
            loading.innerHTML = renderMarkdown(text);
            scrollToBottom();
        }

        function autoGrow() {
            userInput.style.height = "auto";
            userInput.style.height = Math.min(userInput.scrollHeight + 2, 220) + "px";
        }

        async function send() {
            const text = userInput.value.trim();
            if (!text || sendBtn.disabled) return;

            userInput.value = "";
            autoGrow();
            sendBtn.disabled = true;
            addMessage("user", text);
            const loading = addLoading();

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, session_id: sessionId }),
                });
                const data = await res.json();
                sessionId = data.session_id;

                addToolActivity(data.tool_calls || [], loading);
                finish(loading, data.response);
            } catch (e) {
                finish(loading, "Error: " + e.message);
            }
            sendBtn.disabled = false;
            userInput.focus();
        }

        sendBtn.addEventListener("click", send);
        userInput.addEventListener("input", autoGrow);
        userInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                send();
            }
        });
        userInput.focus();
    </script>
</body>

</html>
